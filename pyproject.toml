[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bfmeta-hyperliquid"
version = "0.1.0"
description = "Hyperliquid port of the bfmeta MetaTrader 5 expert advisor"
requires-python = ">=3.11"
dependencies = [
  "hyperliquid-python-sdk>=0.24,<0.25",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
bfmeta-hl = "hyperliquid_bot.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["hyperliquid_bot"]
